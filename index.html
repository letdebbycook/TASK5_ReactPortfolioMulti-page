    <meta name="description" content="Portfolio Personal Debby Gusdi Ahkbar — Mahasiswa TRPL yang membangun aplikasi web & mobile dengan teknologi terkini." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <title>Debby Gusdi Ahkbar — Developer Portfolio</title>
    <link rel="icon" href="/images/icon/icon.png">
    <script>
      (function() {
        const theme = localStorage.getItem('portfolio-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-surface-light dark:bg-surface-dark text-ink-primary dark:text-ink-dark-primary font-sans antialiased selection:bg-brand-600 selection:text-white transition-colors duration-300">

    <script type="module" href="/src/main.jsx" src="/src/main.jsx"></script>
  </body>
