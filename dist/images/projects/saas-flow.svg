<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#flowBg)"/>
  <rect x="40" y="40" width="720" height="370" rx="12" fill="#1e293b" stroke="#4338ca" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="720" height="44" rx="12" fill="#0f172a"/>
  <circle cx="70" cy="62" r="6" fill="#ef4444"/>
  <circle cx="90" cy="62" r="6" fill="#eab308"/>
  <circle cx="110" cy="62" r="6" fill="#22c55e"/>
  <text x="140" y="67" fill="#c7d2fe" font-family="sans-serif" font-size="14" font-weight="600">FlowDesk Kanban Board</text>

  <!-- Kanban Columns -->
  <!-- Column 1: To Do -->
  <rect x="70" y="110" width="200" height="270" rx="8" fill="#0f172a" opacity="0.7"/>
  <text x="90" y="135" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="bold">TO DO (3)</text>
  <rect x="80" y="150" width="180" height="60" rx="6" fill="#1e293b"/>
  <rect x="90" y="165" width="120" height="8" rx="4" fill="#6366f1"/>
  <rect x="90" y="185" width="80" height="6" rx="3" fill="#64748b"/>

  <rect x="80" y="220" width="180" height="60" rx="6" fill="#1e293b"/>
  <rect x="90" y="235" width="140" height="8" rx="4" fill="#818cf8"/>
  <rect x="90" y="255" width="60" height="6" rx="3" fill="#64748b"/>

  <!-- Column 2: In Progress -->
  <rect x="300" y="110" width="200" height="270" rx="8" fill="#0f172a" opacity="0.7"/>
  <text x="320" y="135" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">IN PROGRESS (2)</text>
  <rect x="310" y="150" width="180" height="75" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="320" y="165" width="130" height="8" rx="4" fill="#38bdf8"/>
  <rect x="320" y="185" width="100" height="6" rx="3" fill="#64748b"/>
  <circle cx="460" cy="200" r="10" fill="#0284c7"/>

  <!-- Column 3: Done -->
  <rect x="530" y="110" width="200" height="270" rx="8" fill="#0f172a" opacity="0.7"/>
  <text x="550" y="135" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">COMPLETED (5)</text>
  <rect x="540" y="150" width="180" height="60" rx="6" fill="#1e293b"/>
  <rect x="550" y="165" width="110" height="8" rx="4" fill="#4ade80"/>
  <rect x="550" y="185" width="70" height="6" rx="3" fill="#64748b"/>
</svg>
